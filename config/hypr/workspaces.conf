# Workspace-to-monitor bindings
# Monitor mapping (from nwg-displays):
#   DP-3 = Left
#   DP-1 = Center
#   DP-2 = Right

# Center monitor - terminal, dev
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1

# Left monitor - comms, ai, ai-dev, ai-dev-ext
workspace = 4, monitor:DP-3, default:true, persistent:true
workspace = 5, monitor:DP-3
workspace = 6, monitor:DP-3
workspace = 8, monitor:DP-3

# Right monitor - web, web-ext, misc
workspace = 3, monitor:DP-2, default:true, persistent:true
workspace = 7, monitor:DP-2
workspace = 9, monitor:DP-2
