# Fonts
font_family  RobotoMono Nerd Font
italic_font  SauceCodePro Nerd Font

# bold_font is deliberately `auto` (derive the bold face from font_family).
#
# This line used to read `bold_fond`, a typo, so kitty ignored it and derived
# bold from RobotoMono. Fixing the spelling silently switched every bold glyph
# to SauceCodePro - a different typeface - and since terminal prompts are full
# of bold, it changed how the whole terminal reads. `auto` restores the
# behaviour that was actually in effect for as long as the typo existed, on
# every machine.
#
# italic_font/bold_italic_font were never misspelled, so they have always
# rendered as SauceCodePro. Left alone on purpose.
bold_font    auto
bold_italic_font  SauceCodePro Nerd Font

font_size  13.0

# Increase/decrease line height (in %)
adjust_line_height 0

# Increase/decrease column width (in %)
# adjust_column_width 0

# Increase/decrease baseline
adjust_baseline    0%

# Show/hide multi-character ligatures
disable_ligatures cursor

# Line size for box type drawings
# box_drawing_scale 0.001, 1, 1.5, 2

