# Workspace 1 - terminal
windowrule = workspace 1, match:class kitty

# Workspace 2 - dev
windowrule = workspace 2, match:class code-oss
windowrule = workspace 2, match:class code
windowrule = workspace 2, match:class Code
windowrule = workspace 2, match:class dev\.zed\.Zed
# Zed tiling handled by hypr-zed-tiler.sh (IPC watcher)

# Workspace 3 - web
windowrule = workspace 3, match:class firefox

# Workspace 4 - comms
windowrule = workspace 4, match:class ferdium
windowrule = workspace 4, match:class Slack
windowrule = workspace 4, match:class org.telegram.desktop

# Workspace 5 - ai
windowrule = workspace 5, match:class LM Studio
windowrule = workspace 5, match:class chatgpt

# Workspace 6 - ai-dev

# Workspace 7 - web-ext
# Per-org Firefox profiles land here. Launch a profile with
# `firefox -P <name> --class firefox-<name>` and add a rule to match it.
# Org names are personal, so keep real ones in a private config rather than
# here - this file is public.
# windowrule = workspace 7, match:initial_class firefox-myorg

# Workspace 8 - ai-dev-ext

# Workspace 9 - misc
