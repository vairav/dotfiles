# Tmux Configuration - Server (Minimal)
# No plugins, basic settings only

# Prefix: C-b (tmux default, same as desktop)
# Deliberately NOT C-a: readline beginning-of-line (C-a) is in heavy use.
set -g prefix C-b
bind C-b send-prefix

# Basic options
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi mode for copy
setw -g mode-keys vi

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle through panes with a single chord, no prefix (mirrors prefix+o)
bind -n M-o select-pane -t :.+

# Jump straight to window N, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar (minimal)
set -g status-style 'bg=colour235 fg=colour248'
set -g status-left '[#S] '
set -g status-right '%H:%M'
