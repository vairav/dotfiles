# Per-machine overrides
#
# Included LAST in kitty.conf, so anything here wins over every other config
# file. Intentionally empty by default.
#
# Screens differ: a laptop panel and a large high-DPI desktop monitor want
# different point sizes for the same apparent size. Rather than edit the shared
# fonts.conf - which would change EVERY machine - a machine that needs a
# different value ships its own copy of this file via rcm's host-specific
# directory (host-<hostname>/config/kitty/configs/local.conf).
#
# That keeps the delta tiny: shared changes to fonts.conf still reach every
# machine, and only the overridden settings diverge.
#
# Example (do not uncomment here - put it in the host-specific copy):
#
#   font_size 12.0
