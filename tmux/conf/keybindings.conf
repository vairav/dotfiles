# Key bindings

# Prefix: C-b (tmux default) on all machines.
# Deliberately NOT C-a: readline beginning-of-line (C-a) is in heavy use.
set -g prefix C-b
set -gu prefix2
bind C-b send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Splits (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle through panes with a single chord, no prefix (mirrors prefix+o)
bind -n M-o select-pane -t :.+

# Jump straight to window N, no prefix (browser-tab muscle memory)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session picker (sesh + fzf in a popup) - replaces the default choose-tree
bind s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt '⚡ ' --border-label ' sessions '
)\""

# Native session tree, in case the sesh picker is ever unavailable
bind S choose-tree -Zs

# Jump back to previous session
bind L switch-client -l

# Copy mode (vi-style)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
