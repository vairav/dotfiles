# ml4w kitty integration
# This file is symlinked to ~/.config/kitty/custom.conf by setup.sh
# ml4w's kitty.conf includes ./custom.conf
#
# Only include configs that don't conflict with ml4w defaults
# (ml4w manages fonts, opacity, window size via its own config)

include ~/workspace/dotfiles/config/kitty/configs/cursor.conf
include ~/workspace/dotfiles/config/kitty/configs/bell.conf
include ~/workspace/dotfiles/config/kitty/configs/mouse.conf
