# Startup session
#
# NOTHING IS ACTIVE IN THIS FILE ON PURPOSE.
#
# The directives below (new_tab, launch, cd, title, layout, os_window_size,
# focus) are kitty SESSION-FILE syntax. They are not valid in kitty.conf, and
# when they were live here kitty printed ~20 "Ignoring unknown config key"
# warnings on every single launch while doing nothing at all.
#
# To actually use them, put them in their own file and point kitty at it:
#
#   startup_session ./session.conf     # in kitty.conf
#
# In practice we do not: tmux + sesh own session layout here (see
# tmux/layouts/), and having kitty build tabs too would fight with that.
# Kept as a worked example of the syntax.
#
# Note the shell path: on Apple Silicon Homebrew lives at /opt/homebrew,
# not /usr/local. Prefer a bare `launch zsh` so it follows $PATH.
#
# ## Tab
# new_tab root
# cd ~
# launch zsh
# launch zsh
# enabled_layouts tall:bias=50;full_size=1
#
# new_tab my_workspace
# title my_workspace
# cd ~/workspace
# launch zsh -c "ls -al"
#
# ## Window
# title my_zsh_window
# launch zsh
# launch nvim
#
# ## A tab in the new window
# new_tab my_new_tab_in_new_window
# cd ~/workspace
# layout stack
# launch zsh
#
# ## Another window, sized, and focused
# title another_new_window
# os_window_size 80c 25c
# launch zsh
# focus
