# Launcher
bind = $mainMod, SPACE, exec, ~/.config/hypr/scripts/launcher.sh

# 1Password Quick Access (Wayland can't grab global hotkeys natively)
bind = CTRL SHIFT, SPACE, exec, 1password --quick-access

# Screenshots (mac-like shortcuts, uses ml4w's grim/slurp script)
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/screenshot.sh --instant
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/screenshot.sh

