# TPM and plugins
# Install: prefix + I | Update: prefix + U | Remove: prefix + alt + u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'egel/tmux-gruvbox'

# Gruvbox theme settings
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-right-status-x '%a %b %-d'   # date as "Sat Aug 8"
set -g @tmux-gruvbox-right-status-z '#h '         # hostname, with breathing room at the edge

# Resurrect settings
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM (must be at the end)
run '~/.tmux/plugins/tpm/tpm'

# Post-theme overrides (must come AFTER TPM so they win over the theme)

# Borders: uniform quiet gray on purpose - the active pane is marked by its
# lifted background instead. A colored active border would repaint the shared
# junction glyphs at intersections, causing the "overshooting corner" artifact.
set -g pane-border-lines single
set -g pane-active-border-style 'fg=#3c3836'
set -g pane-border-style 'fg=#3c3836'

# Active pane is LIFTED above the terminal background, not sunk below it.
# Inactive panes keep the terminal's own background so tmux blends with the
# terminal's window padding.
#
# This used to be inverted - active was #0c0d0e, darker than every terminal
# background. That put the pane you actually work in at the highest contrast
# against the foreground (L* 3.6, 11.6:1 vs #c5c9c5), which reads as glare:
# the text looks too bright because the backdrop fell away beneath it. Focus
# should raise a surface, the way a lit panel does, not sink it.
#
# #1d1c19 is kanagawa dragon's own dragonBlack2: L* 10.3, dL* +2.8 above the
# inactive panes, 10.2:1 against the foreground.
#
# The lift is deliberately small. dragonBlack4 (#282727, dL* +8.3) was tried
# first because it measures identically to macOS Terminal's background, and it
# read as too light in practice - a tmux pane is a full-screen surface, so a
# lift that looks right on a small swatch becomes a glowing panel at size.
# dL* ~3 is just past the perceptual threshold, which is all a focus cue needs
# when it covers half the screen.
#
# Tune along this ladder if it still is not right - the hue is fixed (warm,
# blue-red about -3, matching the theme) and only lightness moves:
#   #1b1a18  dL* +1.8  barely there
#   #1d1c19  dL* +2.8  current
#   #201e1c  dL* +4.0
#   #232120  dL* +5.5
#   #282727  dL* +8.3  too light
#
# Terminal backgrounds for reference: alacritty kanagawa #181616 (L* 7.5),
# kitty gruvbox #1d2021. Active must stay above both to read as lifted.
set -g window-style 'bg=default'
set -g window-active-style 'bg=#1d1c19'
