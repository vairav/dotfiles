# matugen template: alacritty wallpaper colors + translucency (ml4w Linux only)
# Rendered by matugen into ~/.config/alacritty/themes/matugen.toml on every
# wallpaper change (setup.sh registers this template in matugen's config.toml).
# Mirrors ml4w's kitty-colors.conf mapping so both terminals match.
# On machines without ml4w the output file stays an empty placeholder.

[window]
opacity = 0.7

[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
cursor = "{{colors.on_surface.default.hex}}"
text = "{{colors.on_surface_variant.default.hex}}"

[colors.selection]
background = "{{colors.secondary_fixed_dim.default.hex}}"
text = "{{colors.on_secondary.default.hex}}"

[colors.normal]
black = "#4c4c4c"
red = "{{colors.error.default.hex}}"
green = "{{colors.on_surface.default.hex}}"
yellow = "#aca98a"
blue = "{{colors.primary.default.hex}}"
magenta = "{{colors.error.default.hex}}"
cyan = "{{colors.on_surface.default.hex}}"
white = "#f0f0f0"

[colors.bright]
black = "{{colors.on_surface.default.hex}}"
red = "#c49ea0"
green = "#9ec49f"
yellow = "#c4c19e"
blue = "#a39ec4"
magenta = "#c49ec4"
cyan = "#9ec3c4"
white = "#e7e7e7"
