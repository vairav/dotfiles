# Fonts
font_family  RobotoMono Nerd Font
italic_font  SauceCodePro Nerd Font

# NOTE: this line used to read `bold_fond` - a typo - so for a long time kitty
# ignored it and derived bold from RobotoMono. Spelling it correctly means bold
# now genuinely renders in SauceCodePro, which is a visibly different typeface
# from the regular face. That is intentional here (it matches italic_font and
# bold_italic_font), but it IS a change from how every machine used to look.
# Set to `auto` to go back to deriving bold from font_family.
bold_font    SauceCodePro Nerd Font
bold_italic_font  SauceCodePro Nerd Font

font_size  13.0

# Increase/decrease line height (in %)
adjust_line_height 0

# Increase/decrease column width (in %)
# adjust_column_width 0

# Increase/decrease baseline
adjust_baseline    0%

# Show/hide multi-character ligatures
disable_ligatures cursor

# Line size for box type drawings
# box_drawing_scale 0.001, 1, 1.5, 2

