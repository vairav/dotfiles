# TPM and plugins
# Install: prefix + I | Update: prefix + U | Remove: prefix + alt + u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'egel/tmux-gruvbox'

# Gruvbox theme settings
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-right-status-x '%a %b %-d'   # date as "Sat Aug 8"
set -g @tmux-gruvbox-right-status-z '#h '         # hostname, with breathing room at the edge

# Resurrect settings
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM (must be at the end)
run '~/.tmux/plugins/tpm/tpm'

# Post-theme overrides (must come AFTER TPM so they win over the theme)

# Borders: uniform quiet gray on purpose - the active pane is marked by its
# darker background instead. A colored active border would repaint the shared
# junction glyphs at intersections, causing the "overshooting corner" artifact.
set -g pane-border-lines single
set -g pane-active-border-style 'fg=#3c3836'
set -g pane-border-style 'fg=#3c3836'

# Active pane gets a clearly darker background; inactive panes keep the
# terminal's own background so tmux blends with the terminal's window padding.
# (Terminal backgrounds: kitty gruvbox #1d2021, alacritty kanagawa #181616 -
# active must be well below both to be visible.)
set -g window-style 'bg=default'
set -g window-active-style 'bg=#0c0d0e'
