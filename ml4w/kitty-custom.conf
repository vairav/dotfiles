# ml4w kitty integration
# This file is symlinked to ~/.config/kitty/custom.conf by setup.sh.
# ml4w's kitty.conf includes ./custom.conf LAST, so everything here wins over
# ml4w's own settings.
#
# Layering: our shared configs are the base (fonts, window, tabs, behavior -
# the same setup every machine gets), then the ml4w look is re-asserted on
# top: matugen wallpaper colors and the translucent background. Result: our
# terminal, ml4w's look.

# --- our base ---
include ~/workspace/dotfiles/config/kitty/configs/general.conf
include ~/workspace/dotfiles/config/kitty/configs/shell.conf
include ~/workspace/dotfiles/config/kitty/configs/scrollback.conf
include ~/workspace/dotfiles/config/kitty/configs/fonts.conf
include ~/workspace/dotfiles/config/kitty/configs/cursor.conf
include ~/workspace/dotfiles/config/kitty/configs/window.conf
include ~/workspace/dotfiles/config/kitty/configs/tabs.conf
include ~/workspace/dotfiles/config/kitty/configs/bell.conf
include ~/workspace/dotfiles/config/kitty/configs/mouse.conf
include ~/workspace/dotfiles/config/kitty/configs/optimizations.conf
# theme-custom.conf is deliberately NOT included here: it carries static
# colors (url_color, borders) that would override the wallpaper palette.
# colors-matugen.conf is already included by ml4w's kitty.conf (a second
# include of it is at best ignored with a startup complaint), so the way to
# let the wallpaper colors win is to include nothing that colors.

# --- ml4w look: translucency (colors come from ml4w's matugen include) ---
background_opacity 0.7
dynamic_background_opacity yes

# --- tiling WM: let Hyprland size windows ---
# The shared window.conf remembers window size/state, but under Hyprland that
# restores a saved "maximized" state and every new kitty jumps to maximized.
remember_window_size no

# --- per-machine override, always last ---
# NOT the repo's configs/local.conf: on ml4w machines rcm does not manage
# kitty, so setup.sh provides this file itself - linking a host-specific
# copy when one exists, or an empty placeholder otherwise.
include $HOME/.config/kitty/local.conf
