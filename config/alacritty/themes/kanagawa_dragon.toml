# Colors (Kanagawa Dragon)
# Source https//github.com/rebelot/kanagawa.nvim

[colors.primary]
# Deliberately NOT upstream kanagawa dragon's #181616 (dragonBlack3). This is
# dragonBlack2 from the same palette, one step lighter: L* 10.3 vs 7.5.
#
# It was picked as the tmux active-pane colour first and liked enough to become
# the terminal's own background, so the surface you work on reads the same
# whether or not tmux is running. tmux/conf/plugins.conf now dims INACTIVE
# panes to #181616 rather than lifting the active one - changing this value
# without reading that file will collapse the two into one colour and destroy
# the focus cue.
background = '#1d1c19'
foreground = '#c5c9c5'

[colors.normal]
black = '#0d0c0c'
blue = '#8ba4b0'
cyan = '#8ea4a2'
green = '#8a9a7b'
magenta = '#a292a3'
red = '#c4746e'
white = '#C8C093'
yellow = '#c4b28a'

[colors.bright]
black = '#a6a69c'
blue = '#7FB4CA'
cyan = '#7AA89F'
green = '#87a987'
magenta = '#938AA9'
red = '#E46876'
white = '#c5c9c5'
yellow = '#E6C384'

[colors.selection]
background = '#2d4f67'
foreground = '#c8c093'

[[colors.indexed_colors]]
index = 16
color = '#ffa066'

[[colors.indexed_colors]]
index = 17
color = '#ff5d62'
