## LazyGit config
## https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

git:
  diffRenderers:
    - # Use delta for diffs (unified view — side-by-side is too cramped in lazygit panels)
      colorArg: always
      command: delta --paging=never

os:
  # Without this, lazygit guesses the editor from git's core.editor ("$EDITOR"), which it
  # doesn't recognise, so it falls back to plain vim. nvim-remote opens a normal nvim with
  # line jump, or the surrounding nvim when lazygit runs inside LazyVim (<leader>gg)
  editPreset: nvim-remote
