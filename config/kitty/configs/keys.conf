# Clear the screen and scrollback: Cmd+K on macOS, Ctrl+Shift+K on Linux.
#
# Both chords send the private sequence \e[9001~. tmux turns it into a pane
# clear (tmux/conf/keybindings.conf), and zsh catches it when tmux is not
# running (zsh/common/keybindings.zsh). This replaces kitty's defaults for
# these chords: cmd+k (clear kitty's own screen, which tmux redraws at once)
# and ctrl+shift+k (scroll up one line, which tmux makes useless anyway).
map cmd+k        send_text all \x1b[9001~
map ctrl+shift+k send_text all \x1b[9001~
