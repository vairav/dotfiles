# Key bindings

# Prefix: C-b (tmux default) on all machines.
# Deliberately NOT C-a: readline beginning-of-line (C-a) is in heavy use.
set -g prefix C-b
set -gu prefix2
bind C-b send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Splits (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle through panes with a single chord, no prefix (mirrors prefix+o)
bind -n M-o select-pane -t :.+

# Jump straight to window N, no prefix (browser-tab muscle memory)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Named terminal on the home bus (labs/tools/nats-bus/bin/term): prefix T asks
# for the name (= prompt file name) and the harness, opens the window here.
bind T command-prompt -p "terminal name:","harness (claude/opencode/kimi/codex/shell):" \
  "run-shell -b \"$HOME/workspace/labs/tools/nats-bus/bin/term --in '#{session_name}' '%1' '%2' '#{pane_current_path}'\""

# Session picker (sesh + fzf in a popup) - replaces the default choose-tree
bind s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt '⚡ ' --border-label ' sessions '
)\""

# Native session tree, in case the sesh picker is ever unavailable
bind S choose-tree -Zs

# Jump back to previous session
bind L switch-client -l

# Copy mode (vi-style)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clear the pane, screen and scrollback: Cmd+K on macOS, Ctrl+Shift+K on Linux.
# tmux never sees the Cmd key, so the terminal sends a private sequence,
# \e[9001~, for both chords (config/alacritty/configs/keys.toml and
# config/kitty/configs/keys.conf), and tmux maps it to the User0 key here.
# Ctrl+L cannot do this job: vim-tmux-navigator takes it for "pane right".
# A full-screen app (vim, less) only gets Ctrl+L to redraw, because a reset
# under it would blank its screen. Outside tmux, zsh catches the same
# sequence (zsh/common/keybindings.zsh).
set -s user-keys[0] "\e[9001~"
bind -n User0 if -F "#{alternate_on}" "send-keys C-l" "send-keys -R C-l" \; clear-history

# Alt+K clears the same way in one chord, the main Linux shortcut: on a PC
# keyboard Alt sits beside the space bar, where Cmd is on a Mac. tmux sees Alt
# itself, so no terminal setting is needed, and Ctrl+Shift+K above stays as a
# backup. A Neovim pane gets Alt+K unchanged (LazyVim's "move line up").
bind -n M-k if -F "#{m/r:^n?vim$,#{pane_current_command}}" "send-keys M-k" "if -F '#{alternate_on}' 'send-keys C-l' 'send-keys -R C-l' ; clear-history"
