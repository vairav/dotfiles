# TPM and plugins
# Install: prefix + I | Update: prefix + U | Remove: prefix + alt + u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'egel/tmux-gruvbox'

# Gruvbox theme settings
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-right-status-x '%a %b %-d'   # date as "Sat Aug 8"
set -g @tmux-gruvbox-right-status-z '#h '         # hostname, with breathing room at the edge

# Resurrect settings
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM (must be at the end)
run '~/.tmux/plugins/tpm/tpm'

# Post-theme overrides (must come AFTER TPM so they win over the theme)

# Borders: uniform quiet gray on purpose - the active pane is marked by its
# lifted background instead. A colored active border would repaint the shared
# junction glyphs at intersections, causing the "overshooting corner" artifact.
set -g pane-border-lines single
set -g pane-active-border-style 'fg=#3c3836'
set -g pane-border-style 'fg=#3c3836'

# Focus cue: the ACTIVE pane is the terminal's own background, and INACTIVE
# panes are pushed down and away from it - darker background AND dimmer text.
#
# Direction matters, and it took three tries to get right:
#
#   1. Active #0c0d0e, darker than every terminal background we ship. That put
#      the pane you actually work in at the highest contrast against the
#      foreground (L* 3.6, 11.6:1 vs #c5c9c5), which reads as glare - the text
#      looks too bright because the backdrop has fallen away beneath it.
#   2. Active lifted to #282727 (dL* +8.3). Measures identically to macOS
#      Terminal's background, but read as too light: a macOS window is a small
#      bordered surface, a tmux pane is edge to edge, and the same lightness
#      that looks neutral in a frame becomes a glowing panel at full size.
#   3. Active lifted to #1d1c19 (dL* +2.8). Comfortable, but too subtle to
#      register while jumping between panes.
#
# The resolution is that the ACTIVE pane should not move at all. It is the
# surface being read, so it wants to be exactly as comfortable as the bare
# terminal - which is why it is `bg=default` and why #1d1c19 was promoted to
# alacritty's own background. All the separation is bought on the INACTIVE
# side, where making things darker and dimmer costs nothing: nobody is reading
# a pane they are not focused on, so it cannot cause glare no matter how far
# it recedes.
#
# Two cues rather than one, because a large-area background shift alone is
# weak peripherally:
#   bg #0d0c0c  dragonBlack0, dL* 6.9 below active - about 2.5x the previous
#               separation, without brightening anything
#   fg #8a8f8a  default text drops L* 80.6 -> 58.9. The eye catches a text
#               contrast change far more readily than a background one.
#
# CAVEAT on the fg dim: window-style fg only repaints text drawn in the
# DEFAULT foreground. Anything that sets its own colour - the starship prompt,
# syntax highlighting, ls output - keeps it and will NOT dim. So the bg cue is
# still doing real work; the fg is an addition, not a replacement.
#
# Tune along this ladder - hue is fixed (warm, matching the theme), only
# lightness moves, and only the inactive side should ever change:
#   #181616  dL* 2.8  too subtle
#   #141313  dL* 4.3
#   #111010  dL* 5.5
#   #0d0c0c  dL* 6.9  current
#
# BOTH sides must be spelled out explicitly. Do NOT write `bg=default` here.
#
# In a tmux style, `default` means INHERIT, not "the terminal's background".
# window-active-style inherits from window-style, so `window-active-style
# bg=default` resolves to whatever window-style already set - which makes the
# active pane identical to the inactive ones. tmux accepts it, reports it back
# verbatim from show-options, and renders no difference whatsoever. It is a
# pure silent no-op, and it cost two rounds of chasing the wrong cause here:
# the panes looked "too subtle" when in fact the active style was never being
# applied at all. A screenshot histogram settled it - every pane measured the
# inactive colour exactly, and the terminal background appeared only in the
# seam between panes.
#
# The active values are therefore hardcoded to match alacritty's background
# (#1d1c19) and foreground (#c5c9c5) rather than inherited. If the alacritty
# theme's primary colours change, change them here too - the cross-reference
# in config/alacritty/themes/kanagawa_dragon.toml says the same.
set -g window-style 'fg=#8a8f8a,bg=#0d0c0c'
set -g window-active-style 'fg=#c5c9c5,bg=#1d1c19'
