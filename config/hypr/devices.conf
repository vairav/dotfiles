# Disable phantom VGA output
monitor = VGA-1, disable

# Laptop display (elite) - no fractional scaling
monitor = eDP-1, 1920x1200@60, 0x0, 1

# Input device settings

input {
  sensitivity = 0
  accel_profile = adaptive
  natural_scroll = true

  touchpad {
    natural_scroll = true
    tap-to-click = true
    scroll_factor = 0.8
  }
}
