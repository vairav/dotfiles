[window]
#decorations = "Buttonless"
decorations = "None"
# Distribute leftover cell-remainder space evenly on all sides,
# so right/bottom padding matches left/top (important inside tmux)
dynamic_padding = true
startup_mode = "Windowed"
option_as_alt = "Both"

[window.dimensions]
columns = 120
lines = 100

[window.padding]
x = 5
y = 5
