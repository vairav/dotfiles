# Starship Configuration
# Powerline-style two-line prompt with Catppuccin Mocha colors

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭](fg:current_line)\
$os\
$nix_shell\
$directory\
$git_branch\
$git_status\
$git_commit\
$git_state\
$fill\
$nodejs\
$dotnet\
$python\
$java\
$lua\
$golang\
$c\
$rust\
$zig\
$aws\
$cmd_duration\
$shell\
$time\
$username\
$line_break\
$character\
"""

palette = 'catppuccin_mocha'
add_newline = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
# Custom mappings for the design
foreground = "#cdd6f4"
background = "#1e1e2e"
current_line = "#45475a"
primary = "#45475a"
box = "#585b70"

[os]
format = '[](fg:peach)[$symbol ](fg:primary bg:peach)[](fg:peach)'
disabled = false

[os.symbols]
Alpine = ''
Amazon = ''
Android = ''
Arch = ''
CentOS = ''
Debian = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Linux = ''
Macos = ''
Manjaro = ''
Mariner = ''
Mint = ''
NetBSD = ''
NixOS = ''
OpenBSD = ''
OpenCloudOS = ''
openEuler = ''
openSUSE = ''
OracleLinux = ''
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Windows = ''

[nix_shell]
disabled = false
impure_msg = ''
style = "bg:yellow fg:primary"
symbol = ' Nix'
format = '[─](fg:current_line)[](fg:yellow)[$symbol ](fg:primary bg:yellow)[](fg:yellow)'
heuristic = false

[directory]
format = '[─](fg:current_line)[](fg:green)[ ](fg:primary bg:green)[](fg:green bg:box)[ $read_only$truncation_symbol](fg:primary bg:box)[$path](fg:foreground bg:box)[](fg:box)'
home_symbol = " "
truncation_symbol = '…'
truncation_length = 2
read_only = '󱧴 '
read_only_style = ''

[directory.substitutions]
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""
"Developer" = ""
"dev" = ""
"workspace" = " "
"dotfiles" = ""

[git_branch]
format = '[─](fg:current_line)[](fg:teal)[$symbol](fg:primary bg:teal)[](fg:teal bg:box)[ $branch](fg:foreground bg:box)'
symbol = ''

[git_status]
disabled = false
format = '[($all_status$ahead_behind)](bg:box)[](fg:box bg:pink)'
conflicted = '[ ](fg:overlay1 bg:box)[  ](fg:red bg:box)'
stashed = '[ ](fg:overlay1 bg:box)[  ](fg:mauve bg:box)'
deleted = '[ ](fg:overlay1 bg:box)[  ](fg:red bg:box)'
renamed = '[ ](fg:overlay1 bg:box)[  ](fg:teal bg:box)'
modified = '[ ](fg:overlay1 bg:box)[  ](fg:peach bg:box)'
typechanged = '[ ](fg:overlay1 bg:box)[  ](fg:peach bg:box)'
staged = '[ ](fg:overlay1 bg:box)[  $count ](fg:green bg:box)'
untracked = '[ ](fg:overlay1 bg:box)[  $count ](fg:sky bg:box)'
diverged = '[ ](fg:overlay1 bg:box)[  $ahead_count  $behind_count ](fg:maroon bg:box)'
ahead = '[ ](fg:overlay1 bg:box)[  $count ](fg:green bg:box)'
behind = '[ ](fg:overlay1 bg:box)[  $count ](fg:red bg:box)'
up_to_date = '[ ](fg:overlay1 bg:box)[  ](fg:green bg:box)'

[git_commit]
commit_hash_length = 5
tag_symbol = ' '
format = '[ # $hash$tag ](fg:primary bg:pink)[](fg:pink bg:background)'
disabled = false
only_detached = false
tag_disabled = false

[git_state]
disabled = false
format = '[$hash$tag](fg:primary bg:pink)(fg:pink bg:background)'
rebase = ''
merge = ''
revert = '󰕌'
cherry_pick = ''
bisect = ''
am = ''
am_or_rebase = ' or '

[nodejs]
format = '[─](fg:current_line)[](fg:green)[$symbol ](fg:primary bg:green)[](fg:green bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = '󰎙 Node.js'

[dotnet]
format = '[─](fg:current_line)[](fg:mauve)[$symbol ](fg:primary bg:mauve)[](fg:mauve bg:box)[$tfm](fg:foreground bg:box)[](fg:box)'
symbol = ' .NET'

[python]
format = '[─](fg:current_line)[](fg:teal)[$symbol ](fg:primary bg:teal)[](fg:teal bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' python'

[java]
format = '[─](fg:current_line)[](fg:red)[$symbol ](fg:primary bg:red)[](fg:red bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' Java'

[lua]
format = '[─](fg:current_line)[](fg:blue)[$symbol ](fg:primary bg:blue)[](fg:blue bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' Lua'

[golang]
format = '[─](fg:current_line)[](fg:teal)[$symbol ](fg:primary bg:teal)[](fg:teal bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' Go'

[c]
format = '[─](fg:current_line)[](fg:blue)[$symbol ](fg:primary bg:blue)[](fg:blue bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' C'

[rust]
format = '[─](fg:current_line)[](fg:red)[$symbol ](fg:primary bg:red)[](fg:red bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' Rust'

[zig]
format = '[─](fg:current_line)[](fg:yellow)[$symbol ](fg:primary bg:yellow)[](fg:yellow bg:box)[$version](fg:foreground bg:box)[](fg:box)'
symbol = ' Zig'

# Only renders when AWS env is active (AWS_PROFILE via mise dir scoping etc.)
[aws]
format = '[─](fg:current_line)[](fg:sapphire)[$symbol ](fg:primary bg:sapphire)[](fg:sapphire bg:box)[ $profile( $region)](fg:foreground bg:box)[](fg:box)'
symbol = ''

[fill]
symbol = '─'
style = 'fg:current_line'

[cmd_duration]
min_time = 500
format = '[─](fg:current_line)[](fg:peach)[ ](fg:primary bg:peach)[](fg:peach bg:box)[$duration](fg:foreground bg:box)[](fg:box)'

[shell]
format = '[─](fg:current_line)[](fg:mauve)[ ](fg:primary bg:mauve)[](fg:mauve bg:box)[ $indicator](fg:foreground bg:box)[](fg:box)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

[time]
format = '[─](fg:current_line)[](fg:mauve)[ ](fg:primary bg:mauve)[](fg:mauve bg:box)[ $time ](fg:foreground bg:box)[](fg:box)'
time_format = '%H:%M'
disabled = false

[username]
format = '[─](fg:current_line)[](fg:yellow)[ ](fg:primary bg:yellow)[](fg:yellow bg:box)[$user](fg:foreground bg:box)[](fg:box) '
show_always = false

[character]
format = """
[╰─$symbol](fg:current_line) """
success_symbol = '[❯](fg:bold green)'
error_symbol = '[×](fg:bold red)'

# Disable unnecessary modules
[battery]
disabled = true

[package]
disabled = true
