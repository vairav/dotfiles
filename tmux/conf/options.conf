# General options

# True color support (Kitty/Alacritty/Ghostty)
#
# One `set -g` with a comma-separated list, NOT three `set -ag`. The -a flag
# APPENDS, and this file is re-sourced on every `tmux source-file ~/.tmux.conf`
# reload, so the three entries accumulated a fresh copy per reload - a live
# server here had each override listed three times. Harmless to rendering, but
# it grows without bound and makes show-options useless for telling whether a
# setting is actually present or just echoed. Assigning the whole list makes a
# reload idempotent.
# `linux*:AX@` is tmux's OWN default entry, not ours - it tells tmux the Linux
# console does not handle default colours. Assigning the array replaces it, so
# it has to be restated here or the TTY on plutus/elite renders backgrounds
# wrong. It stays first, exactly where tmux puts it.
set -g default-terminal "tmux-256color"
set -g terminal-overrides "linux*:AX@,xterm-256color:RGB,*-kitty:RGB,alacritty:RGB"

# Mouse
set -g mouse on

# Extended keys (xterm modifyOtherKeys / CSI-u): lets TUIs inside tmux tell
# Shift-Enter (newline) from Enter (submit) - kimi-code, claude code, etc.
# Two halves, BOTH required, and both live HERE: kitty and alacritty support
# the protocol natively with no config of their own, but tmux only enables it
# on outer terminals its terminal-features list marks `extkeys` - without the
# second line, `extended-keys on` reads back fine and does nothing.
#   extended-keys on  - forward an inner app's request to the outer terminal
#                       (`always` would force CSI-u on apps not expecting it)
#   terminal-features - whole-value assignment, same reload-idempotency rule
#                       as terminal-overrides above; tmux's three default
#                       entries restated, then extkeys ONLY for terminals
#                       that really support it (Terminal.app does not, so
#                       xterm* stays unflagged). Feature lists bind when a
#                       client attaches - detach/reattach after changing.
set -s extended-keys on
set -s terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,alacritty:extkeys,*-kitty:extkeys"
# Encoding for the extended keys above: tmux 3.6+ defaults to xterm's
# modifyOtherKeys format; kimi-code wants the CSI-u encoding instead.
set -g extended-keys-format csi-u

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Scrollback
set -g history-limit 50000

# Faster escape (for vim)
set -sg escape-time 0

# Message display time
set -g display-time 2000

# Focus events for vim autoread
set -g focus-events on

# Vi mode
setw -g mode-keys vi

# When a session is killed, switch to another instead of detaching
# (keeps session-hopping with sesh smooth)
set -g detach-on-destroy off
